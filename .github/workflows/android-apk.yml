name: Android-APK

# Baut die Android-App (android/) und hängt die APK an ein GitHub-Release.
# Neue Version: Tag "app-v1.2" pushen, oder unter Actions → Android-APK →
# "Run workflow" von Hand starten. Normale Pushes auf android/ bauen nur
# zum Testen (APK unter den Artefakten des Laufs, kein Release).
on:
  push:
    tags: ['app-v*']
    branches: ['**']
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsname (z. B. 1.2)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Version bestimmen
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#app-v}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            NAME="0.0.${{ github.run_number }}-test"
          else
            NAME="${{ inputs.version }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$NAME" >> "$GITHUB_OUTPUT"

      # Signaturschlüssel aus den Repository-Secrets (siehe README)
      - name: Signaturschlüssel
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Keine Signatur-Secrets gesetzt – APK wird mit Wegwerf-Schlüssel signiert, Updates brauchen dann eine Neuinstallation."
          fi

      - name: APK bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk ../satho-net.apk

      - uses: actions/upload-artifact@v4
        with:
          name: satho-net-apk
          path: satho-net.apk

      - name: Release veröffentlichen
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Satho-Net App ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: satho-net.apk
          body: |
            Android-App für Satho-Net.

            **Installieren:** `satho-net.apk` auf dem Handy herunterladen, öffnen und
            „Aus dieser Quelle installieren“ erlauben. Updates einfach drüber installieren.
